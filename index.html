<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoe Landing Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
      h1,
      h2,
      .serif {
        font-family: "Playfair Display", serif;
      }
    </style>
  </head>
  <!--  -->
  <body class="bg-[#F7F4EF] text-[#2C2C2C]">
    <header
      class="py-6 px-6 md:px-12 flex items-center justify-between sticky top-0 bg-[#F7F4EF]/80 backdrop-blur-md z-50"
    >
      <!-- Logo -->

      <div class="flex-1">
        <h1 class="text-xl md:text-2xl font-bold tracking-tighter italic serif">
          Covenance
        </h1>
      </div>


      <!-- Navigation Links (Desktop) -->
      <nav class="hidden md:block flex-1">
        <ul
          class="flex items-center justify-center gap-10 text-sm font-medium uppercase tracking-widest"
        >
          <li><a href="#" class="hover:text-amber-700 transition">Home</a></li>
          <li><a href="#" class="hover:text-amber-700 transition">Men</a></li>
          <li><a href="#" class="hover:text-amber-700 transition">Women</a></li>
          <li>
            <a href="#" class="hover:text-amber-700 transition">Accessories</a>
          </li>
          <li>
            <a href="#" class="hover:text-amber-700 transition">Contact</a>
          </li>
        </ul>
      </nav>

      <!-- Cart Button & Search -->
      <div class="flex items-center justify-end gap-4 md:gap-6 flex-1">
        <button class="hover:scale-110 transition cursor-pointer">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        </button>
        <button class="hidden sm:block hover:scale-110 transition cursor-pointer">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </button>
        <button class="hover:scale-110 transition cursor-pointer relative">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
            <path d="M3 6h18" />
            <path d="M16 10a4 4 0 0 1-8 0" />
          </svg>
          <span
            class="absolute -top-2 -right-2 bg-amber-800 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center"
            >0</span
          >
        </button>
      </div>
    </header>




    <!-- Hero Section -->

    <section class="px-4 md:px-8 pb-12">
      <div class="relative w-full h-[500px] md:h-[600px] rounded-2xl md:rounded-3xl overflow-hidden group">
        <img
          src="https://images.unsplash.com/photo-1552346154-21d32810aba3?q=80&w=2070&auto=format&fit=crop"
          alt="Hero Shoe"
          class="w-full h-full object-cover transition duration-700 group-hover:scale-105"
        />

        <div class="absolute inset-0 bg-black/30 flex flex-col justify-center px-8 md:px-16">
          <h2 class="text-white text-4xl sm:text-5xl md:text-7xl font-bold leading-tight max-w-xs md:max-w-md serif">
            Sneakers That Defy Your Everyday Look
          </h2>
          <button
            class="mt-6 md:mt-8 bg-white text-black px-6 py-2 md:px-8 md:py-3 rounded-full font-medium w-fit hover:bg-black hover:text-white transition-all duration-300 cursor-pointer"
          >
            Shop Now
          </button>
        </div>

        <div class="absolute bottom-6 right-6 md:bottom-10 md:right-10 flex gap-3 md:gap-4">
          <button class="w-10 h-10 md:w-12 md:h-12 border border-white/50 rounded-full flex items-center justify-center text-white hover:bg-white hover:text-black transition-all duration-300 cursor-pointer backdrop-blur-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          
          <button class="w-10 h-10 md:w-12 md:h-12 border border-white/50 rounded-full flex items-center justify-center text-white hover:bg-white hover:text-black transition-all duration-300 cursor-pointer backdrop-blur-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </section>

  </body>
</html>
